<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit Engine</title>
</head><script src="script.js" defer></script>

<body>

  <main>
    <h1>Drum Kit Engine</h1>

    <section aria-labelledby="drum-title">
      <h2 id="drum-title">Drum Pads</h2>

      <div class="drum-kit">

        <button
          type="button"
          class="drum-pad"
          data-sound="kick"
          data-key="a"
        >
          Kick
          <span>A</span>
        </button>

        <button
          type="button"
          class="drum-pad"
          data-sound="snare"
          data-key="s"
        >
          Snare
          <span>S</span>
        </button>

        <button
          type="button"
          class="drum-pad"
          data-sound="hihat"
          data-key="d"
        >
          Hi-Hat
          <span>D</span>
        </button>

        <button
          type="button"
          class="drum-pad"
          data-sound="tom"
          data-key="f"
        >
          Tom
          <span>F</span>
        </button>

      </div>
    </section>

  </main>

</body>
</html>
